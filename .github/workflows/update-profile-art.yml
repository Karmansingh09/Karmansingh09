name: Update Profile Telemetry

on:
  schedule:
    # Run everyday at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install minimal dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Fetch latest contributions
        run: |
          python scripts/fetch_contributions.py

      - name: Render updated heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py

      - name: Check for changes and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          if git diff --staged --quiet; then
            echo "No changes in contribution graph."
          else
            git commit -m "chore: refresh contribution graph [skip ci]"
            git push
          fi
