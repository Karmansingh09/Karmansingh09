<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#0a0d12" />
    </linearGradient>
    <linearGradient id="cardHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>

  <style>
    .card-border {
      fill: url(#cardBg);
      stroke: #30363d;
      stroke-width: 1;
    }
    .card-header {
      fill: url(#cardHeader);
      stroke: #30363d;
      stroke-width: 0.5;
    }
    .btn-red { fill: #ff5f56; }
    .btn-yellow { fill: #ffbd2e; }
    .btn-green { fill: #27c93f; }

    .card-title {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #8b949e;
      letter-spacing: 0.5px;
    }

    .prompt-user {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11.5px;
      font-weight: 700;
      fill: #39d353;
    }
    .prompt-sep {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11.5px;
      fill: #8b949e;
    }
    .prompt-path {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11.5px;
      font-weight: 700;
      fill: #58a6ff;
    }
    .cmd-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11.5px;
      fill: #f0f6fc;
    }

    .field-key {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #58a6ff;
    }
    .field-sep {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      fill: #6e7681;
    }
    .field-val {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      fill: #c9d1d9;
    }

    .section-title {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #e3b341;
    }
    .proj-name {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #e6edf3;
    }
    .proj-desc {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 10px;
      fill: #8b949e;
    }

    .term-badge {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 9.5px;
      font-weight: 600;
      fill: #c9d1d9;
      letter-spacing: 0.4px;
    }

    .footer-text {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 9.5px;
      fill: #6e7681;
    }
    .footer-accent {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 9.5px;
      font-weight: 600;
      fill: #39d353;
    }

    /* Sequential fade and slight slide-in */
    @keyframes lineFadeIn {
      0% {
        opacity: 0;
        transform: translateY(4px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .term-line {
      opacity: 0;
      animation-name: lineFadeIn;
      animation-duration: 0.35s;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
      animation-fill-mode: forwards;
    }

    /* Subtle cursor blink */
    @keyframes cursorBlink {
      0%, 45% { opacity: 1; }
      55%, 100% { opacity: 0.2; }
    }
    .cursor {
      animation: cursorBlink 1.1s infinite;
    }
  </style>

  <!-- Container Box -->
  <rect x="1" y="1" width="838" height="358" rx="8" class="card-border" />

  <!-- Terminal Header Bar -->
  <path d="M 1 9 A 8 8 0 0 1 9 1 L 831 1 A 8 8 0 0 1 839 9 L 839 30 L 1 30 Z" class="card-header" />

  <!-- Window Controls -->
  <circle cx="16" cy="15" r="4.5" class="btn-red" />
  <circle cx="30" cy="15" r="4.5" class="btn-yellow" />
  <circle cx="44" cy="15" r="4.5" class="btn-green" />

  <!-- Window Title -->
  <text x="62" y="19" class="card-title">karman@github: ~ (sysinfo --developer)</text>

  <!-- Terminal Body Lines -->

    <g class="term-line" style="animation-delay: 0.08s;">
      <text x="26" y="56" class="prompt-user">karman@github</text>
      <text x="116" y="56" class="prompt-sep">:</text>
      <text x="124" y="56" class="prompt-path">~</text>
      <text x="134" y="56" class="prompt-sep">$</text>
      <text x="146" y="56" class="cmd-text">neofetch --developer --verbose</text>
    </g>

    <g class="term-line" style="animation-delay: 0.16s;">
      <line x1="26" y1="69" x2="814" y2="69" stroke="#30363d" stroke-width="1" stroke-dasharray="3,3" />
    </g>

    <g class="term-line" style="animation-delay: 0.22s;">
      <line x1="440" y1="79" x2="440" y2="320" stroke="#21262d" stroke-width="1" />
    </g>

    <g class="term-line" style="animation-delay: 0.27s;">
      <text x="26" y="93" class="field-key">OS</text>
      <text x="126" y="93" class="field-sep">&#10140;</text>
      <text x="142" y="93" class="field-val">Arch Linux x86_64</text>
    </g>

    <g class="term-line" style="animation-delay: 0.32s;">
      <text x="26" y="114.5" class="field-key">Host</text>
      <text x="126" y="114.5" class="field-sep">&#10140;</text>
      <text x="142" y="114.5" class="field-val">B.Tech CSE (AI/ML) — 2nd Year</text>
    </g>

    <g class="term-line" style="animation-delay: 0.37s;">
      <text x="26" y="136.0" class="field-key">Kernel</text>
      <text x="126" y="136.0" class="field-sep">&#10140;</text>
      <text x="142" y="136.0" class="field-val">Karman Singh @ Karmansingh09</text>
    </g>

    <g class="term-line" style="animation-delay: 0.42s;">
      <text x="26" y="157.5" class="field-key">Uptime</text>
      <text x="126" y="157.5" class="field-sep">&#10140;</text>
      <text x="142" y="157.5" class="field-val">Curious, building &amp; shipping continuously</text>
    </g>

    <g class="term-line" style="animation-delay: 0.47s;">
      <text x="26" y="179.0" class="field-key">Focus</text>
      <text x="126" y="179.0" class="field-sep">&#10140;</text>
      <text x="142" y="179.0" class="field-val">AI/ML • Web3 / Blockchain • Full-Stack • DevOps</text>
    </g>

    <g class="term-line" style="animation-delay: 0.52s;">
      <text x="26" y="200.5" class="field-key">Languages</text>
      <text x="126" y="200.5" class="field-sep">&#10140;</text>
      <text x="142" y="200.5" class="field-val">C, Python, TypeScript, JavaScript, Java</text>
    </g>

    <g class="term-line" style="animation-delay: 0.57s;">
      <text x="26" y="222.0" class="field-key">Frontend</text>
      <text x="126" y="222.0" class="field-sep">&#10140;</text>
      <text x="142" y="222.0" class="field-val">React, Next.js, Vite, Tailwind CSS</text>
    </g>

    <g class="term-line" style="animation-delay: 0.62s;">
      <text x="26" y="243.5" class="field-key">Backend</text>
      <text x="126" y="243.5" class="field-sep">&#10140;</text>
      <text x="142" y="243.5" class="field-val">Node.js, Express, MongoDB</text>
    </g>

    <g class="term-line" style="animation-delay: 0.67s;">
      <text x="26" y="265.0" class="field-key">Web3 / DLT</text>
      <text x="126" y="265.0" class="field-sep">&#10140;</text>
      <text x="142" y="265.0" class="field-val">Celo, Midnight Network, Stellar, Solidity</text>
    </g>

    <g class="term-line" style="animation-delay: 0.72s;">
      <text x="26" y="286.5" class="field-key">Tools &amp; Env</text>
      <text x="126" y="286.5" class="field-sep">&#10140;</text>
      <text x="142" y="286.5" class="field-val">Git, GitHub, Docker, Linux, Neovim / VS Code</text>
    </g>

    <g class="term-line" style="animation-delay: 0.35s;">
      <text x="460" y="93" class="section-title">ACTIVE_DEPLOYMENTS</text>
      <line x1="615" y1="89" x2="814" y2="89" stroke="#21262d" stroke-width="1" />
    </g>

    <g class="term-line" style="animation-delay: 0.42s;">
      <circle cx="466" cy="111.5" r="3" fill="#39d353" />
      <text x="476" y="115" class="proj-name">RoadEye / NetraFlow</text>
      <text x="476" y="129" class="proj-desc">AI-powered ANPR &amp; urban traffic analytics</text>
    </g>

    <g class="term-line" style="animation-delay: 0.49s;">
      <circle cx="466" cy="144.5" r="3" fill="#39d353" />
      <text x="476" y="148" class="proj-name">Confidential P2P Lending</text>
      <text x="476" y="162" class="proj-desc">Privacy-preserving credit desk on Midnight Network</text>
    </g>

    <g class="term-line" style="animation-delay: 0.56s;">
      <circle cx="466" cy="177.5" r="3" fill="#39d353" />
      <text x="476" y="181" class="proj-name">CeloAgent</text>
      <text x="476" y="195" class="proj-desc">Autonomous on-chain agent spending &amp; policy controls</text>
    </g>

    <g class="term-line" style="animation-delay: 0.63s;">
      <circle cx="466" cy="210.5" r="3" fill="#39d353" />
      <text x="476" y="214" class="proj-name">MiniSwap</text>
      <text x="476" y="228" class="proj-desc">Decentralized AMM &amp; liquidity pool protocol</text>
    </g>

    <g class="term-line" style="animation-delay: 0.71s;">
      <rect x="460" y="257" width="168" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <circle cx="474" cy="269" r="3.5" fill="#39d353" />
      <text x="486" y="273" class="term-badge">STATUS: SHIP_READY</text>

      <rect x="640" y="257" width="170" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="0.8" />
      <circle cx="654" cy="269" r="3.5" fill="#58a6ff" />
      <text x="666" y="273" class="term-badge">NETWORK: WEB3_DLT</text>
    </g>

    <g class="term-line" style="animation-delay: 0.82s;">
      <rect x="26" y="340" width="22" height="9" rx="2" fill="#21262d" /><rect x="53" y="340" width="22" height="9" rx="2" fill="#ff5f56" /><rect x="80" y="340" width="22" height="9" rx="2" fill="#27c93f" /><rect x="107" y="340" width="22" height="9" rx="2" fill="#ffbd2e" /><rect x="134" y="340" width="22" height="9" rx="2" fill="#58a6ff" /><rect x="161" y="340" width="22" height="9" rx="2" fill="#bc8cff" /><rect x="188" y="340" width="22" height="9" rx="2" fill="#39c5cf" /><rect x="215" y="340" width="22" height="9" rx="2" fill="#f0f6fc" />
      <!-- Blinking block cursor -->
      <rect x="252" y="340" width="8" height="9" fill="#58a6ff" class="cursor" />
      <text x="814" y="348" text-anchor="end" class="footer-text">SHELL: <tspan class="footer-accent">ZSH</tspan> | UTF-8</text>
    </g>
</svg>
